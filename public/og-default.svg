<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#012169"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative glows -->
  <circle cx="120" cy="120" r="240" fill="#C8102E" opacity="0.06"/>
  <circle cx="1080" cy="510" r="280" fill="#012169" opacity="0.08"/>
  <!-- Union Jack bottom bar -->
  <rect x="0"   y="600" width="400" height="30" fill="#C8102E"/>
  <rect x="400" y="600" width="400" height="30" fill="#fff" opacity="0.9"/>
  <rect x="800" y="600" width="400" height="30" fill="#012169"/>
  <!-- Flag emoji hint -->
  <text x="600" y="220" font-family="sans-serif" font-size="64" text-anchor="middle">🇬🇧</text>
  <!-- Logo text -->
  <text x="600" y="320" font-family="Georgia, serif" font-weight="bold" font-size="76" fill="url(#txt)" text-anchor="middle">OnlyBritishFans</text>
  <!-- Tagline -->
  <text x="600" y="400" font-family="sans-serif" font-size="30" fill="#7a8399" text-anchor="middle">Britain&#39;s #1 OnlyFans Creator Directory</text>
  <!-- Sub-tagline -->
  <text x="600" y="450" font-family="sans-serif" font-size="22" fill="#555e78" text-anchor="middle">Find British creators by location, price &amp; more</text>
</svg>
