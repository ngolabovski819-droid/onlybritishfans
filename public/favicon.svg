<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="r"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- Blue field -->
    <rect width="32" height="32" fill="#012169"/>
    <!-- White saltire (St Andrew / St Patrick diagonals) -->
    <line x1="0" y1="0" x2="32" y2="32" stroke="#fff" stroke-width="9"/>
    <line x1="32" y1="0" x2="0" y2="32" stroke="#fff" stroke-width="9"/>
    <!-- Red counter-saltire stripes (St Patrick, offset) -->
    <line x1="0" y1="4"  x2="28" y2="32" stroke="#C8102E" stroke-width="4.5"/>
    <line x1="4"  y1="0" x2="32" y2="28" stroke="#C8102E" stroke-width="4.5"/>
    <line x1="32" y1="4"  x2="4"  y2="32" stroke="#C8102E" stroke-width="4.5"/>
    <line x1="28" y1="0" x2="0"  y2="28" stroke="#C8102E" stroke-width="4.5"/>
    <!-- White cross (St George) -->
    <rect x="12" y="0"  width="8" height="32" fill="#fff"/>
    <rect x="0"  y="12" width="32" height="8" fill="#fff"/>
    <!-- Red cross (St George) -->
    <rect x="13.5" y="0"  width="5" height="32" fill="#C8102E"/>
    <rect x="0"    y="13.5" width="32" height="5" fill="#C8102E"/>
  </g>
</svg>
